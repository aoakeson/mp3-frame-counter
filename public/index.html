<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MP3 Frame Counter</title>
    <style>
      :root { color-scheme: light dark; --accent: #2f6fde; --muted: #8a8f98; }
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
      h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
      p { margin-top: 0; color: var(--muted); }
      label { display: block; border: 2px dashed var(--muted); border-radius: 0.75rem; padding: 2rem 1rem; text-align: center; cursor: pointer; }
      label:focus-within, label.over { border-color: var(--accent); }
      input[type="file"] { display: block; margin: 0.5rem auto 0; max-width: 100%; }
      button { margin-top: 1rem; width: 100%; padding: 0.75rem; font: inherit; border: 0; border-radius: 0.5rem; background: var(--accent); color: #fff; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      output { display: block; margin-top: 1.5rem; }
      output strong { display: block; font-size: 2.5rem; }
      output strong.error { font-size: 1.125rem; }
      code { color: var(--muted); font-size: 0.875rem; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>MP3 Frame Counter</h1>
    <p>Counts the audio frames in an MPEG-1 Layer III file, using <code>POST /file-upload</code>.</p>

    <form>
      <label id="drop">
        Drop an MP3 here, or choose one
        <input id="file" type="file" accept=".mp3,audio/mpeg" />
      </label>
      <button type="submit" disabled>Count frames</button>
    </form>

    <output aria-live="polite"></output>

    <script>
      const form = document.querySelector("form");
      const input = document.querySelector("#file");
      const drop = document.querySelector("#drop");
      const button = form.querySelector("button");
      const output = document.querySelector("output");

      input.addEventListener("change", () => (button.disabled = !input.files.length));

      drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
      drop.addEventListener("dragleave", () => drop.classList.remove("over"));
      drop.addEventListener("drop", (e) => {
        e.preventDefault();
        drop.classList.remove("over");
        input.files = e.dataTransfer.files;
        input.dispatchEvent(new Event("change"));
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        button.disabled = true;
        output.textContent = "Counting…";
        try {
          // Sent as the raw body, the path that streams on the server.
          const res = await fetch("/file-upload", { method: "POST", body: input.files[0] });
          // Cloudflare's own limit errors are HTML, not JSON.
          const body = await res.json().catch(() => ({ error: `Unexpected ${res.status} response` }));
          output.replaceChildren(
            Object.assign(document.createElement("strong"), {
              className: res.ok ? "" : "error",
              textContent: res.ok ? `${body.frameCount.toLocaleString()} frames` : body.error,
            }),
            Object.assign(document.createElement("code"), {
              textContent: `${res.status} ${JSON.stringify(body)}`,
            }),
          );
        } catch {
          output.textContent = "Could not reach the server. Is it running?";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
